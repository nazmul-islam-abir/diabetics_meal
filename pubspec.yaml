publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  fl_chart: ^1.2.0
  auto_size_text: ^3.0.0
  animated_notch_bottom_bar: 1.0.4
  video_player: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
